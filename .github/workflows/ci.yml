name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # ワークフロー（公開の手順を含む）の書き間違いを検出する
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  integration-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db:start
      - run: npm run test:integration
        # Edge Runtime（Deno）上での起動確認も行う（npm に直接つながる CI でのみ可能）
        env:
          EDGE_FUNCTIONS: '1'
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results

  # main に入ったら本番に公開する（D-08）。CI がすべて通ったときだけ動く。手順は docs/deploy.md
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, integration-e2e]
    runs-on: ubuntu-latest
    concurrency: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 公開の設定を確認
        id: configured
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY ANTHROPIC_API_KEY; do
            [ -z "$(eval echo \$$name)" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice::公開用の設定が未登録のため公開をスキップしました:$missing（docs/deploy.md）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.configured.outputs.ready == 'true'
        run: npm ci
      - name: DB のマイグレーションを適用
        if: steps.configured.outputs.ready == 'true'
        run: |
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx supabase db push --yes --password "$SUPABASE_DB_PASSWORD"
      - name: Edge Function と API キーを反映
        if: steps.configured.outputs.ready == 'true'
        run: |
          npx supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
          npx supabase functions deploy suggest-meals --project-ref "$SUPABASE_PROJECT_REF"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: 画面をビルド
        if: steps.configured.outputs.ready == 'true'
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Cloudflare Pages に公開
        if: steps.configured.outputs.ready == 'true'
        run: |
          # 初回はプロジェクトを作る（既にあれば失敗するので無視し、本当に問題があれば次の公開で失敗する）
          npx wrangler@4.148.0 pages project create souschef --production-branch main || true
          npx wrangler@4.148.0 pages deploy dist --project-name souschef --branch main
