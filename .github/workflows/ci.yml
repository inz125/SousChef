name: CI

on:
  push:
  pull_request:

# 既定ではリポジトリの読み取りだけを許す
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # ワークフロー（公開の手順を含む）の書き間違いを検出する
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  # ドキュメントだけの変更なら、時間のかかる統合テスト・E2E（と公開）を省く
  changes:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.diff.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: diff
        run: node scripts/ci-changes.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}

  integration-e2e:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:db:start
      - run: npm run test:integration
        # Edge Runtime（Deno）上での起動確認も行う（npm に直接つながる CI でのみ可能）
        env:
          EDGE_FUNCTIONS: '1'
      # ブラウザ本体はキャッシュし、OS のライブラリだけ毎回入れる
      - id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results

  # main に入ったら本番に公開する（D-08）。CI がすべて通ったときだけ動く。手順は docs/deploy.md
  # ドキュメントだけの変更では integration-e2e が省かれ、公開も行わない
  # 鍵は GitHub の Environment「production」に置き、main からの実行にだけ渡す（docs/deploy.md「鍵の扱い」）
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, integration-e2e]
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    permissions:
      contents: read
    steps:
      - name: 公開の設定を確認
        id: configured
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_URL SUPABASE_PROJECT_REF CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice::公開用の設定が未登録のため公開をスキップしました:$missing（docs/deploy.md）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # パッケージのインストール時に動くスクリプトから鍵が見えないよう、鍵は使う手順にだけ渡す
      - if: steps.configured.outputs.ready == 'true'
        run: npm ci
      # supabase link は使わない（管理者用の秘密鍵を読む「API Key Secrets」権限が必要になるため）。
      # DB は接続文字列で直接更新し、アクセストークンは Edge Function の公開だけに使う
      - name: DB のマイグレーションを適用
        if: steps.configured.outputs.ready == 'true'
        run: |
          # 接続文字列の形を先に確かめ、よくある間違い（角かっこの残り・記号・接続先の種類）を日本語で示す
          node scripts/check-db-url.mjs
          npx supabase db push --yes --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Edge Function を反映
        if: steps.configured.outputs.ready == 'true'
        # Claude の API キーは GitHub に置かず、Supabase の画面で直接登録する（docs/deploy.md）
        run: npx supabase functions deploy suggest-meals --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      - name: 画面をビルド
        if: steps.configured.outputs.ready == 'true'
        run: |
          # 画面に埋め込む設定の形を先に確かめる（URL とキーの取り違えで画面が真っ白になったため）
          node scripts/check-public-config.mjs
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      - name: Cloudflare Pages に公開
        if: steps.configured.outputs.ready == 'true'
        run: |
          # 初回はプロジェクトを作る（既にあれば失敗するので無視し、本当に問題があれば次の公開で失敗する）
          npx wrangler@4.148.0 pages project create souschef --production-branch main || true
          npx wrangler@4.148.0 pages deploy dist --project-name souschef --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
